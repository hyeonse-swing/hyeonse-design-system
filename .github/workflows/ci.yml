name: Design system
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check all tracked generated artifacts
        run: |
          git diff --exit-code -- dist llms.txt llms-full.txt docs/assets/fonts/noto-kr-subset.woff2 scripts/font-coverage.json
          test -z "$(git ls-files --others --exclude-standard -- dist llms.txt llms-full.txt docs/assets/fonts/noto-kr-subset.woff2 scripts/font-coverage.json)"
      - run: npm pack --dry-run
  browser:
    runs-on: ubuntu-latest
    # WebKit's Ubuntu system dependencies can take more than 15 minutes on a cold runner.
    timeout-minutes: ${{ matrix.browser == 'webkit' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run verify:browser -- ${{ matrix.browser }}
      - run: npm run verify:sizing -- ${{ matrix.browser }}
      - run: npm run verify:fields -- ${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            output/browser/
            output/browser-sizing/
            output/browser-field-layout/
          retention-days: 7
  consumer-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: node scripts/check-consumer-compat.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: consumer-compat
          path: output/consumer-compat/evidence.json
          retention-days: 7
